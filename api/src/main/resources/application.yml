spring:
    application:
        name: api
    config:
        import: optional:file:.env[.properties]
    datasource:
        url: ${DB_URL}
        username: ${DB_USERNAME}
        password: ${DB_PASSWORD}
        driver-class-name: org.postgresql.Driver
        hikari:
            pool-name: ClaxiHikariPool
            maximum-pool-size: 5
            minimum-idle: 1
            connection-timeout: 30000
            validation-timeout: 5000
            max-lifetime: 1500000
server:
    servlet:
        context-path: /api/v1
springdoc:
    api-docs:
        path: /open-api
    swagger-ui:
        path: /docs
